<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your NEXORA account - profile, orders, and preferences.">
  <title>My Account - NEXORA</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="header-wrapper"></div>

  <main class="page">
    <div class="page-header">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span aria-hidden="true">/</span>
        <span>My Account</span>
      </nav>
      <h1>My Account</h1>
    </div>

    <div class="container">
      <div class="account-layout" id="account-layout">
        <div class="account-sidebar" id="account-sidebar">
          <div class="account-user-card" id="account-user-card"></div>
          <nav class="account-nav">
            <button class="account-nav-btn active" data-tab="profile">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Profile
            </button>
            <button class="account-nav-btn" data-tab="orders">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
              Orders
            </button>
            <button class="account-nav-btn" data-tab="addresses">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              Addresses
            </button>
            <button class="account-nav-btn" data-tab="settings">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              Settings
            </button>
          </nav>
        </div>
        <div class="account-main" id="account-main"></div>
      </div>
    </div>
  </main>

  <div class="footer-wrapper"></div>

  <script src="js/config.js"></script>
  <script src="js/data/categories.js"></script>
  <script src="js/data/products.js"></script>
  <script src="js/services/productService.js"></script>
  <script src="js/services/cartService.js"></script>
  <script src="js/services/wishlistService.js"></script>
  <script src="js/services/authService.js"></script>
  <script src="js/services/orderService.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      initHeader();
      APP.init();

      const user = await AuthService.getCurrentUser();
      renderUserCard(user);
      renderProfile(user);

      document.querySelectorAll(".account-nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".account-nav-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          switchTab(btn.dataset.tab, user);
        });
      });

      document.getElementById("logout-btn")?.addEventListener("click", async () => {
        await AuthService.logout();
        showToast("Logged out successfully");
        setTimeout(() => window.location.href = "index.html", 500);
      });
    });

    function renderUserCard(user) {
      const card = document.getElementById("account-user-card");
      if (!user) {
        card.innerHTML = '<div class="account-user-avatar guest">?</div><div class="account-user-info"><h3>Guest</h3><p>Sign in for full features</p></div>';
        return;
      }
      const initials = user.name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
      card.innerHTML = `<div class="account-user-avatar">${initials}</div><div class="account-user-info"><h3>${escapeHtml(user.name)}</h3><p>${escapeHtml(user.email)}</p></div>`;
    }

    async function switchTab(tab, user) {
      switch (tab) {
        case "profile": renderProfile(user); break;
        case "orders": await renderOrders(); break;
        case "addresses": renderAddresses(user); break;
        case "settings": renderSettings(user); break;
      }
    }

    function renderProfile(user) {
      const main = document.getElementById("account-main");
      if (!user) {
        main.innerHTML = `<div class="account-empty"><h3>Sign in to view your profile</h3><a href="#" class="btn btn-primary" onclick="document.querySelector('[data-tab=profile]').click();return false;">Sign In</a></div>`;
        return;
      }
      main.innerHTML = `
        <div class="account-section">
          <h2>Profile Information</h2>
          <form class="account-form" id="profile-form">
            <div class="form-row"><div class="form-group"><label>Name</label><input type="text" id="profile-name" value="${escapeHtml(user.name)}" required></div><div class="form-group"><label>Email</label><input type="email" id="profile-email" value="${escapeHtml(user.email)}" required></div></div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>`;
      document.getElementById("profile-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("profile-name").value.trim();
        const email = document.getElementById("profile-email").value.trim();
        if (!name || !email) return;
        const result = await AuthService.updateProfile({ name, email });
        if (result.success) {
          showToast("Profile updated");
          renderUserCard(result.user);
        }
      });
    }

    async function renderOrders() {
      const main = document.getElementById("account-main");
      const orders = await OrderService.getOrders();
      if (orders.length === 0) {
        main.innerHTML = `<div class="account-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg><h3>No orders yet</h3><p>Your order history will appear here.</p><a href="shop.html" class="btn btn-primary">Start Shopping</a></div>`;
        return;
      }
      main.innerHTML = `<div class="account-section"><h2>Order History (${orders.length})</h2><div class="orders-list">${orders.reverse().map(o => `
        <div class="order-card">
          <div class="order-header"><span class="order-id">${o.id}</span><span class="order-status order-status--${o.status}">${o.status}</span></div>
          <div class="order-items">${o.items.map(i => `<div class="order-item"><span>${escapeHtml(i.name)}</span><span>Qty: ${i.quantity}</span><span>${CONFIG.CURRENCY_SYMBOL}${(i.price * i.quantity).toFixed(2)}</span></div>`).join("")}</div>
          <div class="order-footer"><span class="order-date">${new Date(o.createdAt).toLocaleDateString()}</span><span class="order-total">Total: ${CONFIG.CURRENCY_SYMBOL}${o.total.toFixed(2)}</span></div>
        </div>`).join("")}</div></div>`;
    }

    function renderAddresses(user) {
      const main = document.getElementById("account-main");
      main.innerHTML = `<div class="account-section"><h2>Saved Addresses</h2><div class="account-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><h3>No saved addresses</h3><p>Add an address during checkout to save it here.</p></div></div>`;
    }

    function renderSettings(user) {
      const main = document.getElementById("account-main");
      main.innerHTML = `<div class="account-section"><h2>Account Settings</h2><div class="account-danger-zone"><h3>Danger Zone</h3><p>Permanently delete your account and all associated data.</p><button class="btn btn-danger" id="logout-btn">Sign Out</button></div></div>`;
      document.getElementById("logout-btn").addEventListener("click", async () => {
        await AuthService.logout();
        showToast("Signed out");
        setTimeout(() => window.location.href = "index.html", 500);
      });
    }
  </script>
</body>
</html>
