<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all NEXORA products. Shop power chargers, productivity tools, audio, smart home, and travel essentials.">
  <title>Shop - NEXORA</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="header-wrapper"></div>

  <main class="page">
    <div class="page-header">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span aria-hidden="true">/</span>
        <span>Shop</span>
      </nav>
      <h1>Shop All Products</h1>
    </div>
    <div class="container">
      <button class="mobile-filter-toggle btn btn-outline btn-sm" id="mobile-filter-toggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="10" y2="18"/></svg>
        Filters
      </button>
      <div class="active-filters" id="active-filters" style="display:none;"></div>
      <div class="shop-layout">
        <aside class="shop-sidebar" id="shop-sidebar" aria-label="Filters">
          <div class="shop-sidebar-header">
            <h3>Filters</h3>
            <button class="shop-sidebar-close" id="shop-sidebar-close" aria-label="Close filters">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="filter-group">
            <h3>Category</h3>
            <div id="filter-categories"></div>
          </div>
          <div class="filter-group">
            <h3>Price Range</h3>
            <div class="price-range-inputs">
              <input type="number" id="price-min" placeholder="Min" min="0" aria-label="Minimum price">
              <span>—</span>
              <input type="number" id="price-max" placeholder="Max" min="0" aria-label="Maximum price">
            </div>
          </div>
          <div class="filter-group">
            <h3>Rating</h3>
            <div id="filter-rating"></div>
          </div>
          <div class="filter-group">
            <h3>Availability</h3>
            <label class="filter-option">
              <input type="checkbox" id="filter-stock"> In Stock Only
            </label>
          </div>
          <button class="btn btn-outline btn-full btn-sm" id="clear-filters">Clear All Filters</button>
        </aside>
        <div class="shop-main">
          <div class="shop-toolbar">
            <span class="shop-result-count" id="result-count"></span>
            <div class="shop-sort">
              <select id="sort-select" aria-label="Sort products">
                <option value="featured">Featured</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
                <option value="discount">Biggest Discount</option>
                <option value="newest">Newest</option>
              </select>
            </div>
          </div>
          <div class="products-grid" id="shop-products"></div>
          <div class="empty-state" id="no-results" style="display:none;">
            <div class="empty-state-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
            <h2>No products found</h2>
            <p>Try adjusting your filters or search terms.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="footer-wrapper"></div>

  <script src="js/config.js"></script>
  <script src="js/data/categories.js"></script>
  <script src="js/data/products.js"></script>
  <script src="js/services/productService.js"></script>
  <script src="js/services/cartService.js"></script>
  <script src="js/services/wishlistService.js"></script>
  <script src="js/services/authService.js"></script>
  <script src="js/services/orderService.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/shop.js"></script>
</body>
</html>
